[project]
name = "id-card-print-service"
version = "0.1.0"
description = "FastAPI + Pillow renderer for Zebra ZXP7 ID card print jobs"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pillow>=10.2",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0,<2.0.0",
  "asyncpg>=0.31.0",
  "greenlet>=3.3.0",
  "fpdf2>=2.8.5",
  "qrcode>=8.2",
  "cryptography>=46.0.3",
  "apscheduler>=3.11.2",
]

[tool.uv]
package = false
